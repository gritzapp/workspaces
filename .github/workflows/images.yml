name: Images

# The images don't contain gritz, so they are versioned independently of it.
# The weekly rebuild picks up new Debian packages and agent CLI releases.
on:
  push:
    branches: [ main ]
    paths:
      - images/**
      - .github/workflows/images.yml
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/gritzapp

jobs:
  debian:
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.tags.outputs.date }}
      sha: ${{ steps.tags.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      # Computed once here so both images carry the same date and commit tags.
      - id: tags
        run: |
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
          echo "sha=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/workspace-debian
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.tags.outputs.date }}
            type=raw,value=${{ steps.tags.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images
          file: images/Dockerfile.debian
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The agent CLI install layers (Claude Code, Codex, Copilot, Cursor)
          # never change textually, so cached layers would pin stale versions.
          no-cache: true

  mise:
    needs: debian
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/workspace-mise
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.debian.outputs.date }}
            type=raw,value=${{ needs.debian.outputs.sha }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: images
          file: images/Dockerfile.mise
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-contexts: workspace-debian=docker-image://${{ env.REGISTRY }}/workspace-debian:${{ needs.debian.outputs.sha }}
          # The mise install layer never changes textually, so a cached
          # layer would pin mise at whatever version the first build fetched.
          no-cache: true
